<!DOCTYPE html>
<html lang="ptbr">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="images/favicon-32x32.png" type="image/x-icon">
        <title>Aula imagens</title>
    </head>
    <body>
        <h1>Desafio das imagens - Vitoria</h1>
        <h2>Vitoria</h2>
        <figure>
            <img src="images/vitoria.jpg" width="400" alt="Igreja do centro de Vitoria.">
            <figcaption>Igreja do centro de Vitoria.</figcaption>
        </figure>
        <picture>
            <source media="(max-width: 500px)" srcset="images/paisagem-p.jpg">
            <source media="(min-width: 500px)" srcset="images/paisagem.jpg">
            <img src="images/paisagem.jpg" alt="Terceira Ponte" width="100%"> 
        </picture>
    </body>
</html>
